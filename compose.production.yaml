name: minicloud
x-app: &app
  image: minicloud:${RELEASE:-local}
  build:
    context: .
    dockerfile: deploy/Dockerfile
  env_file: .env.production
  restart: unless-stopped
  init: true
  volumes:
    - app-storage:/var/www/html/storage
  networks: [backend]
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: '3'}
  depends_on:
    mysql: {condition: service_healthy}
  security_opt: [no-new-privileges:true]

services:
  web:
    <<: *app
    ports: ['${WEB_BIND_ADDRESS:-127.0.0.1}:8085:80']
    mem_limit: 192m
    healthcheck:
      test: [CMD, php, -r, "exit(@file_get_contents('http://127.0.0.1/up') === false ? 1 : 0);"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
  queue:
    <<: *app
    user: www-data
    command: [php, artisan, 'queue:work', '--tries=1', '--sleep=3', '--memory=80', '--max-time=3600']
    mem_limit: 128m
    stop_grace_period: 90s
  scheduler:
    <<: *app
    user: www-data
    command: [php, artisan, 'schedule:work']
    mem_limit: 128m
    stop_grace_period: 90s
  infra:
    <<: *app
    environment:
      FAKE_INFRA_SERVE: 'true'
      INFRA_DB_DATABASE: /var/www/html/storage/infra/infra.sqlite
    volumes: [infra-storage:/var/www/html/storage]
    mem_limit: 128m
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: ['--log-bin-trust-function-creators=1', '--innodb-buffer-pool-size=32M', '--max-connections=25', '--performance-schema=OFF', '--mysqlx=OFF']
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?required}
      MYSQL_USER: ${DB_USERNAME:?required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?required}
    volumes: [mysql-data:/var/lib/mysql]
    networks: [backend]
    mem_limit: 256m
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 --silent']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
networks:
  backend:
volumes:
  mysql-data:
  app-storage:
  infra-storage:
