x-app: &app
    image: 'sail-8.5/app'
    extra_hosts:
        - 'host.docker.internal:host-gateway'
    environment:
        WWWUSER: '${WWWUSER}'
        LARAVEL_SAIL: 1
        XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
        XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
        IGNITION_LOCAL_SITES_PATH: '${PWD}'
    volumes:
        - '.:/var/www/html'
    networks:
        - sail
    depends_on:
        mysql:
            condition: service_healthy

services:
    laravel.test:
        <<: *app
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
    queue:
        <<: *app
        command: php artisan queue:work --tries=1 --sleep=1
        restart: unless-stopped
    scheduler:
        <<: *app
        command: php artisan schedule:work
        restart: unless-stopped
    # the fake infrastructure: same codebase, own process and own sqlite database.
    # (plain php -S, because `artisan serve` would drop FAKE_INFRA_SERVE)
    infra:
        <<: *app
        command: >
            sh -c "touch database/infra.sqlite &&
            php artisan migrate --database=infra --path=Modules/FakeInfra/database/infra --force &&
            cd public &&
            php -S 0.0.0.0:8000 ../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php"
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            FAKE_INFRA_SERVE: 'true'
        ports:
            - '${INFRA_PORT:-8087}:8000'
        restart: unless-stopped
    mysql:
        image: 'mysql:8.4'
        # triggers (append-only ledger) need this when the binlog is on
        command: --log-bin-trust-function-creators=1
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
            MYSQL_EXTRA_OPTIONS: '${MYSQL_EXTRA_OPTIONS:-}'
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 10
            timeout: 5s
    phpmyadmin:
        image: 'phpmyadmin:latest'
        ports:
            - '${PMA_PORT:-8086}:80'
        environment:
            PMA_HOST: mysql
            PMA_USER: '${DB_USERNAME}'
            PMA_PASSWORD: '${DB_PASSWORD}'
        networks:
            - sail
        depends_on:
            - mysql
networks:
    sail:
        driver: bridge
volumes:
    sail-mysql:
        driver: local
